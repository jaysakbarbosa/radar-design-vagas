name: Radar Vagas

on:
  schedule:
    - cron: "0 15 * * 1,4"     # segunda e quinta 12:00 (Natal): varredura completa com IA
    - cron: "0 15 * * 0,2,3,5,6" # demais dias 12:00: lembretes de prazos e datas
    - cron: "15 */3 * * *"     # a cada 3h: lê e responde seus comandos no Telegram
  workflow_dispatch:
    inputs:
      mode:
        description: "full, reminders ou poll"
        default: "full"

permissions:
  contents: write

concurrency:
  group: radar-vagas
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Executar bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '0 15 * * 1,4' && 'full' || (github.event.schedule == '0 15 * * 0,2,3,5,6' && 'reminders' || 'poll')) }}
        run: |
          case "$MODE" in
            full) python bot.py ;;
            reminders) python bot.py --reminders ;;
            *) python bot.py --poll ;;
          esac
      - name: Salvar estado
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "atualiza estado" && git push)
